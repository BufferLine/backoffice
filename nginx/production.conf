server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Docker embedded DNS — resolve upstreams at request time so a missing
    # container yields a 502 on that route instead of crashing nginx at boot.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # API + health
    location /api/ {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
    }

    # OpenAPI docs (dev convenience)
    location /docs {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
    }
    location /openapi.json {
        set $backend_upstream "backend:8000";
        proxy_pass http://$backend_upstream;
    }

    # Everything else → frontend
    location / {
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
